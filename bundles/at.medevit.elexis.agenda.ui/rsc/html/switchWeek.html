<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="x-ua-compatible" content="IE=9" />
    <meta charset="utf-8" />

    <link href="../fullcalendar.min.css" rel="stylesheet" />
    <link href="../fullcalendar.print.min.css" rel="stylesheet" media="print" />
    <link href="../lib/qTip/jquery.qtip.min.css" rel="stylesheet" />
    <link href="../lib/cupertino/jquery-ui.min.css" rel="stylesheet" />
    <link href="../style.css" rel="stylesheet" />
 
  	<script src="../lib/jquery.min.js"></script>
 	<script src="../lib/qTip/jquery.qtip.min.js"></script>
    <script src="../lib/moment.min.js"></script>
    <script src="../fullcalendar.js"></script>
    <script src="../locale-all.js"></script>
    <script src="../scheduler.min.js"></script>

    <script>
      $(document).ready(function () {
      	let schedulerLicenseKey = [+[]]+[+!+[]]+[!+[]+!+[]]+[!+[]+!+[]+!+[]+!+[]+!+[]+!+[]]+[!+[]+!+[]+!+[]+!+[]+!+[]+!+[]]+[+!+[]]+[!+[]+!+[]+!+[]+!+[]+!+[]+!+[]+!+[]+!+[]]+[+[]]+[+[]]+[!+[]+!+[]+!+[]+!+[]+!+[]+!+[]+!+[]+!+[]+!+[]]+(+((+(+!+[]+[+!+[]]+(!![]+[])[!+[]+!+[]+!+[]]+[!+[]+!+[]]+[+[]])+[])[+!+[]]+[+[]+[+[]]+[+[]]+[+[]]+[+[]]+[+[]]+[+!+[]]])+[])[!+[]+!+[]]+(![]+[])[+[]]+([][(![]+[])[+[]]+(![]+[])[!+[]+!+[]]+(![]+[])[+!+[]]+(!![]+[])[+[]]]+[])[!+[]+!+[]+!+[]]+(![]+[])[!+[]+!+[]+!+[]]+(+((+(+!+[]+[+!+[]]+(!![]+[])[!+[]+!+[]+!+[]]+[!+[]+!+[]]+[+[]])+[])[+!+[]]+[+[]+[+[]]+[+[]]+[+[]]+[+[]]+[+[]]+[+!+[]]])+[])[!+[]+!+[]]+[+!+[]]+[!+[]+!+[]+!+[]+!+[]+!+[]+!+[]]+[!+[]+!+[]+!+[]]+[!+[]+!+[]+!+[]+!+[]+!+[]]+[!+[]+!+[]+!+[]]+[+!+[]]+[!+[]+!+[]+!+[]+!+[]+!+[]]+[!+[]+!+[]+!+[]+!+[]]+[!+[]+!+[]+!+[]+!+[]]+[!+[]+!+[]+!+[]+!+[]];

        ['TimeGrid', 'ResourceGrid'].forEach(function (name) {
          var proto = $.fullCalendar[name] && $.fullCalendar[name].prototype;
          if (proto) {
            proto.unrenderNowIndicator = function () {
              if (this.el) {
                this.el.find('.fc-now-indicator').remove();
              }
              this.nowIndicatorEls = null;
            };
          }
        });

        (function () {
          var proto = $.fullCalendar.Calendar.prototype;
          var original = proto.updateViewSize;
          proto.updateViewSize = function () {
            var counter = this.ignoreUpdateViewSize;
            try {
              return original.apply(this, arguments);
            } finally {
              this.ignoreUpdateViewSize = counter;
            }
          };
        })();

        (function () {
          var proto = $.fullCalendar.Calendar.prototype;
          var original = proto.thawContentHeight;
          proto.thawContentHeight = function () {
            original.apply(this, arguments);
            if (this.freezeContentHeightDepth < 0) {
              this.freezeContentHeightDepth = 0;
              this.contentEl.css({width: '', height: '', overflow: ''});
            }
          };
        })();

        $('#calendar').fullCalendar({
          locale: 'de',
          defaultView: 'agendaWeek',
          editable: true,
          eventLimit: true, // allow "more" link when too many events
          nowIndicator: true,
          minTime: '06:00:00',
          maxTime: '23:00:00',
          slotDuration: '00:05:00',
          slotEventOverlap: false,
          schedulerLicenseKey,
          groupByDateAndResource: true,
          displayEventTime: false,
          allDaySlot: true,
          weekends: false,
          events: loadEventsCallback,
          dayClick: dayClickCallback,
          eventDrop: function (event, delta, revertFunc, jsEvent, ui, view) {
            eventDropFunction(event.id, event.start.format(), event.end.format(), event.resourceId, jsEvent.ctrlKey);
          },
          eventResize: function (event, delta, revertFunc, jsEvent, ui, view) {
            eventResizeFunction(event.id, event.start.format(), event.end.format());
          },
          eventRender: eventRenderCallback,
          eventAfterAllRender: function (view) {
            view.updateNowIndicator();
            markDayBoundaries();
          },
          viewRender: function () {
            setTimeout(function () {
              var cal = $('#calendar');
              var calendar = cal.data('fullCalendar');
              if (calendar && calendar.freezeContentHeightDepth > 0) {
                calendar.freezeContentHeightDepth = 0;
                calendar.contentEl.css({width: '', height: '', overflow: ''});
              }
              adjustCalendarHeight();
              markDayBoundaries();
            }, 0);
          },
          windowResize: function () {
            adjustCalendarHeight();
            markDayBoundaries();
          },
          eventDragStart: function (event, jsEvent, ui, view) {
            event.qtip('destroy');
          },
          eventResizeStart: function (event, jsEvent, ui, view) {
            event.qtip('destroy');
          },
          customButtons: {
            switch: {
              text: 'Tag',
              click: function () {
                switchFunction('parallel');
              },
            },
            reload: {
              text: '',
              icon: 'refresh',
              click: function () {
                $('#calendar').fullCalendar('refetchEvents');
              },
            },
          },
          header: {
            left: 'title',
            center: '',
            right: 'switch reload,today prev,next',
          },
          resources: loadResources,
          resourceOrder: 'order',
          resourceRender: function (resourceObj, labelTds) {
            var color = getColorForResource(resourceObj.id);
            if (color.indexOf('undefined') === -1) {
              labelTds.css('background-color', color);
            }
            labelTds.qtip({
              content: {text: resourceObj.title},
              style: {classes: 'qtip-light'},
              position: {my: 'top center', at: 'bottom center', viewport: $('#calendar')},
              show: {delay: 250, solo: true},
              hide: {delay: 0},
            });
          }
        });
      });

      function adjustCalendarHeight() {
        var cal = $('#calendar');
        var container = cal.find('.fc-view-container');
        if (!container.length) {
          return;
        }
        var available = window.innerHeight - container.offset().top;
        cal.fullCalendar('option', 'contentHeight', 'auto');
        if (container.outerHeight() > available) {
          cal.fullCalendar('option', 'contentHeight', available);
        }
      }

      function markDayBoundaries() {
        var cal = $('#calendar');
        cal.find('.elexis-day-end').removeClass('elexis-day-end');
        cal.find('[data-date]').each(function () {
          var next = this.nextElementSibling;
          if (next && next.getAttribute('data-date') && next.getAttribute('data-date') !== this.getAttribute('data-date')) {
            $(this).addClass('elexis-day-end');
          }
        });
      }

      var colorMapping = {};

      function loadResources(callback) {
        var resources = JSON.parse(loadResourcesFunction());
        resources.forEach(function (resource) {
          colorMapping[resource.id] = 'rgba(' + resource.color + ', 0.4)';
        });
        callback(resources);
      }

      function getColorForResource(resourceId) {
        return colorMapping[resourceId] || 'rgba(255, 255, 255, 0.4)';
      }

      function loadEventsCallback(start, end, timezone, callback) {
        var eventsJson = loadEventsFunction(start.format(), end.format(), timezone);
        var jsonEvents = JSON.parse(eventsJson);

        var events = [];
        var processedResources = {};
        jsonEvents.forEach(function (event) {
          var resourceId = event.resource;
          if (resourceId && !processedResources[resourceId]) {
            var color = getColorForResource(resourceId);
            if (color.indexOf('undefined') === -1) {
              var bgStart = new Date();
              var bgEnd = new Date();
              bgStart.setFullYear(bgStart.getFullYear() - 1);
              bgEnd.setFullYear(bgEnd.getFullYear() + 3);
              events.push({
                resourceId: resourceId,
                start: bgStart.toISOString().split('T')[0] + 'T00:00',
                end: bgEnd.toISOString().split('T')[0] + 'T23:59',
                rendering: 'background',
                color: color
              });
            }
            processedResources[resourceId] = true;
          }
          events.push({
            id: event.id,
            title: event.title,
            start: event.start,
            end: event.end,
            description: event.description,
            icon: event.icon,
            rendering: event.rendering,
            borderColor: event.borderColor,
            backgroundColor: event.backgroundColor,
            textColor: event.textColor,
            allDay: event.allDay,
            resourceId: event.resource       
          });
        });
        callback(events);
      }

      var dayClickSlotDate;
      var dayClickPosX;
      var dayClickPosY;

      function dayClickCallback(date, jsEvent, view, resourceObj) {
        if (dayClickSlotDate) {
          if (typeof resourceObj !== 'undefined') {
            dayClickFunction(date.format(), resourceObj.id);
          } else {
            dayClickFunction(date.format());
          }
          dayClickSlotDate = null;
        } else {
          singleClickFunction();
          dayClickSlotDate = date;
          dayClickPosX = jsEvent.pageX;
          dayClickPosY = jsEvent.pageY;
          $('#calendar').mousemove(function (jqEvent) {
            if (dayClickSlotDate) {
              if (dayClickPosX != jqEvent.pageX || dayClickPosY != jqEvent.pageY) {
                dayClickSlotDate = null;
              }
            }
          });
        }
      }

      function eventRenderCallback(event, element) {
        element.click(function () {
          singleClickFunction(event.id);
        });
        element.dblclick(function () {
          doubleClickFunction(event.id);
        });
        element.contextmenu(function () {
          contextMenuFunction(event.id);
        });
        if (event.rendering === undefined) {
          if (!element.hasClass('fc-helper')) {
            element.qtip({
              style: {classes: 'qtip-dark'},
              show: {
                delay: 250,
                solo: true,
              },
              hide: {
                delay: 0,
              },
              content: {
                title: '[' + event.resourceId + '] ' + event.title + ((event.end === undefined || event.end == null || event.start === undefined || event.start == null) ? '' : '<br/>Von/Bis: ' + event.start.format('HH:mm') + '-' + event.end.format('HH:mm')),
                text: event.description,
              },
              position: {
                my: 'bottom center',
                at: 'top center',
                target: element,
                viewport: $('#calendar'),
              },
              events: {
                show: function(showEvent, api) { 
                  var contactInfoJson = loadContactInfoFunction(event.id);
                  if(contactInfoJson !== null) {
                    var contactInfo = JSON.parse(contactInfoJson);
                    // Now we set the content manually (required!)
                    api.set('content.title', 
                      '[' + event.resourceId + '] ' + event.title + 
                      ((event.end === undefined || event.end == null || event.start === undefined || event.start == null) ? '' : '<br/>Von/Bis: ' + event.start.format('HH:mm') + '-' + event.end.format('HH:mm')) + 
                      ((contactInfo.tel === undefined || contactInfo.tel == null) ? '' : '<br/>Tel: ' + contactInfo.tel) + 
                      ((contactInfo.mail === undefined || contactInfo.mail == null) ? '' : '<br/>Mail: ' + contactInfo.mail));
                  }
                 }
              }
            });
          }
        }
        if (event.description) {
          var firstpart = event.description.split('<br /><br />');
          if (firstpart.length > 0) {
            element.find('.fc-title').append('<br/>' + firstpart[0]);
          } else {
            element.find('.fc-title').append('<br/>' + event.description);
          }
        }
        if (event.borderColor) {
          element.find('div.fc-content').wrapAll("<div class='event-status-block'></div>");
          element.find('div.event-status-block').css('border-color', event.borderColor);
        }
        if (event.icon) {
          element.find('div.fc-content').prepend("<i class='ui-icon ui-calendar-icon " + event.icon + "'></i>");
        }
      }
    </script>
    <style>
      body {
        margin: 10px 0 0 0;
        padding: 0;
        font-family: 'Lucida Grande', Helvetica, Arial, Verdana, sans-serif;
        font-size: 14px;
        background-color: #ffffff;
      }

      #calendar {
        margin: 0 auto;
        width: 100%;
      }

      .fc-resource-cell {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 0 2px;
        font-size: 12px;
		font-weight: semi bold;
      }

      .fc-day-header {
        font-size: 16px;
      }

      .fc td.elexis-day-end,
      .fc th.elexis-day-end {
        border-right: 2px solid #b4bcc4;
      }
    </style>
  </head>

  <body oncontextmenu="return false;">

      <p style="background-color: #fffa00">
        You are using an outdated version of Internet Explorer. For security reasons you should upgrade your browser. Please go to
        Windows Updates and install the latest version.
      </p>
    <![endif]-->
    <div id="calendar"></div>
  </body>
</html>
